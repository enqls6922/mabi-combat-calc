<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에린 전투력 환산 계산기 (2026.09 Ver)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }
    .gold-gradient-text {
      background: linear-gradient(135deg, #fce043 0%, #fb7185 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- 상단 네비게이션 -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-4 py-3 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-amber-500/10 border border-amber-500/30 rounded-lg text-amber-400">
          <i data-lucide="calculator" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold gold-gradient-text tracking-wide">에린 전투력 환산기 <span class="text-[10px] text-emerald-400 border border-emerald-500/30 bg-emerald-500/10 px-1.5 py-0.5 rounded ml-1">v26.09</span></h1>
          <p class="text-xs text-slate-400">최신 메타 브리레흐 / 탈라가흐 완벽 대응</p>
        </div>
      </div>

      <div class="flex items-center space-x-3 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
        <span class="text-xs text-slate-400">목표 던전:</span>
        <select id="dungeonSelect" class="bg-transparent text-xs font-bold text-amber-300 focus:outline-none cursor-pointer">
          <option value="talagach" class="bg-slate-900 text-purple-300">🔥 탈라가흐 (보호 250+)</option>
          <option value="brireche_4" class="bg-slate-900 text-rose-300">⚔️ 브리레흐 4관 (보호 220)</option>
          <option value="brireche_13" selected class="bg-slate-900 text-rose-200">⚔️ 브리레흐 1~3관 (보호 180)</option>
          <option value="glen_hard" class="bg-slate-900">글렌베르나 어려움 (보호 150)</option>
          <option value="chrom_100" class="bg-slate-900">크롬바스 100% (보호 120)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
    
    <!-- 좌측: 유저 스펙 입력 영역 -->
    <section class="lg:col-span-7 space-y-6">
      
      <!-- 1. 캐릭터 & 아르카나 정보 -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
        <h2 class="text-sm font-semibold text-amber-400 mb-4 flex items-center gap-2">
          <i data-lucide="swords" class="w-4 h-4"></i> 1. 캐릭터 & 아르카나 정보
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">캐릭터 닉네임</label>
            <input type="text" id="nicknameInput" maxlength="12" placeholder="밀레시안" value="밀레시안"
              class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">서버</label>
            <select id="serverSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-400 focus:outline-none">
              <option value="류트">류트</option>
              <option value="만돌린">만돌린</option>
              <option value="하프">하프</option>
              <option value="울프">울프</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">아르카나 재능 (2026)</label>
            <select id="arcanaSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-bold text-amber-300 focus:border-amber-400 focus:outline-none">
              <option value="forbidden_alchemist">포비든 알케미스트</option>
              <option value="variable_gunner">배리어블 거너</option>
              <option value="dark_mage">다크 메이지</option>
              <option value="elemental_knight">엘레멘탈 나이트</option>
              <option value="alchemic_stinger">알케믹 스팅어</option>
              <option value="saint_bard">세인트 바드</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 2. 베이스 스탯 & 무기 스펙 -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
        <h2 class="text-sm font-semibold text-amber-400 flex items-center gap-2">
          <i data-lucide="activity" class="w-4 h-4"></i> 2. 베이스 스탯 및 핵심 장비
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label id="baseStatLabel" class="block text-xs text-slate-400 mb-1">노도핑 베이스 스탯</label>
            <input type="number" id="baseStatInput" value="1500" min="0" max="5000"
              class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-semibold text-amber-300 focus:border-amber-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">무기 피어싱 레벨</label>
            <select id="piercingSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-400 focus:outline-none">
              <option value="0">0 레벨</option>
              <option value="1">1 레벨</option>
              <option value="2">2 레벨</option>
              <option value="3">3 레벨</option>
              <option value="4" selected>4 레벨</option>
              <option value="5">5 레벨</option>
              <option value="6">6 레벨</option>
              <option value="7">7 레벨</option>
              <option value="8">8 레벨</option>
              <option value="9">9 레벨</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">특별개조 (무기 타입)</label>
            <select id="weaponTypeSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-400 focus:outline-none">
              <option value="two_handed" selected>양손무기 (스태프/실린더 포함)</option>
              <option value="one_handed">한손무기</option>
            </select>
          </div>
          <div class="flex gap-2">
            <div class="flex-1">
              <label class="block text-xs text-slate-400 mb-1">R강 단계</label>
              <select id="upgradeSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-400 focus:outline-none">
                <option value="0">노개조 / S강</option>
                <option value="1">R1강</option>
                <option value="2">R2강</option>
                <option value="3">R3강</option>
                <option value="4">R4강</option>
                <option value="5">R5강</option>
                <option value="6">R6강</option>
                <option value="7" selected>R7강</option>
                <option value="8">R8강</option>
              </select>
            </div>
            <div class="flex-1">
              <label class="block text-xs text-slate-400 mb-1">보너스 대미지 (%)</label>
              <input type="number" id="bonusDamageInput" value="15" min="0" max="60" step="0.5"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-400 focus:outline-none">
            </div>
          </div>
        </div>
        <p id="rGradeInfoText" class="text-[11px] text-emerald-400 text-right mt-1">현재 적용 크리 기댓값 계산 중...</p>
      </div>

      <!-- 3. 아르카나별 유효 세공 동적 추가 -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-sm font-semibold text-amber-400 flex items-center gap-2">
              <i data-lucide="sparkles" class="w-4 h-4"></i> 3. 유효 세공 옵션 설정
            </h2>
            <p class="text-[11px] text-slate-400">해당 아르카나의 딜 기여도에 비례해 스탯으로 자동 환산됩니다.</p>
          </div>
          <button id="addReforgeBtn" class="flex items-center gap-1 text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-lg hover:bg-amber-500/30 transition">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> 세공 추가
          </button>
        </div>
        <div id="reforgeListContainer" class="space-y-3"></div>
      </div>

    </section>

    <!-- 우측: 환산 결과 카드 -->
    <section class="lg:col-span-5 space-y-6">
      
      <div class="bg-gradient-to-b from-slate-900 via-slate-900 to-indigo-950/40 border border-indigo-500/30 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
          <span id="cardDungeonBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-rose-950/60 border border-rose-500/40 text-rose-300">
            브리레흐 1~3관 기준
          </span>
          <span id="cardServerBadge" class="text-xs text-slate-400 font-medium">류트 | 밀레시안</span>
        </div>

        <div class="relative w-full h-48 bg-slate-950 rounded-xl border border-slate-800 overflow-hidden mb-4 flex flex-col items-center justify-center">
            <i data-lucide="flask-conical" class="w-16 h-16 text-slate-700 mb-2"></i>
            <span id="arcanaBadge" class="text-xs font-semibold text-slate-400">포비든 알케미스트</span>
        </div>

        <div class="text-center bg-slate-950/70 border border-slate-800/80 rounded-xl p-4 mb-4">
          <span class="text-xs text-slate-400 block mb-1">최종 실효 환산 전투력</span>
          <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-amber-500 tracking-tight" id="totalScoreText">
            3,250
          </div>
          <p id="tierVerdict" class="text-xs font-semibold text-emerald-400 mt-2">계산 중...</p>
        </div>

        <div class="space-y-2 text-xs border-t border-slate-800 pt-3">
          <div class="flex justify-between text-slate-400">
            <span>순수 베이스 스탯</span>
            <span id="breakdownBase" class="text-slate-200 font-semibold">0</span>
          </div>
          <div class="flex justify-between text-slate-400">
            <span>피어싱 관통 환산치</span>
            <span id="breakdownPiercing" class="text-amber-400 font-semibold">+ 0</span>
          </div>
          <div class="flex justify-between text-slate-400">
            <span>크뎀/보뎀 곱연산 환산치</span>
            <span id="breakdownMult" class="text-sky-400 font-semibold">+ 0</span>
          </div>
          <div class="flex justify-between text-slate-400">
            <span>세공 실효 환산치</span>
            <span id="breakdownReforge" class="text-emerald-400 font-semibold">+ 0</span>
          </div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
          <i data-lucide="trending-up" class="w-4 h-4"></i> 구간별 스펙업 효율 리포트
        </h3>
        <div class="space-y-2.5 text-xs" id="efficiencyReport"></div>
      </div>

    </section>
  </main>

  <script>
    const Security = {
      sanitizeString(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
          return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
        });
      },
      clampNumber(val, min, max, defaultVal = 0) {
        const num = parseFloat(val);
        if (isNaN(num)) return defaultVal;
        return Math.min(Math.max(num, min), max);
      }
    };

    const R_GRADE_DATA = {
      two_handed: { 0: 0, 1: 0.06, 2: 0.16, 3: 0.26, 4: 0.38, 5: 0.50, 6: 0.62, 7: 0.74, 8: 0.89 },
      one_handed: { 0: 0, 1: 0.04, 2: 0.11, 3: 0.18, 4: 0.26, 5: 0.34, 6: 0.42, 7: 0.50, 8: 0.60 }
    };

    const ARCANAS = {
      forbidden_alchemist: {
        name: '포비든 알케미스트', statType: '연금술 대미지', statUnit: '환산치', defaultWeapon: 'two_handed',
        validReforges: [
          { id: 'water_cannon', name: '워터 캐논 대미지 (장갑)', maxLevel: 20, weightPerLevel: 0.0035 },
          { id: 'flame_burst', name: '플레이머 대미지 (모자)', maxLevel: 20, weightPerLevel: 0.003 },
          { id: 'alchemy_mastery', name: '연금술 마스터리 (옷)', maxLevel: 20, weightPerLevel: 0.002 },
          { id: 'cylinder_dmg', name: '실린더 최대 대미지', maxLevel: 20, flatAdd: 3 }
        ]
      },
      variable_gunner: {
        name: '배리어블 거너', statType: '최대 대미지', statUnit: '맥뎀', defaultWeapon: 'two_handed',
        validReforges: [
          { id: 'dual_gun_max', name: '듀얼건 최대 대미지 (무기)', maxLevel: 25, flatAdd: 5 },
          { id: 'bullet_storm', name: '불릿 스톰 대미지 (장갑)', maxLevel: 20, weightPerLevel: 0.004 },
          { id: 'shooting_rush', name: '슈팅 러쉬 대미지 (신발)', maxLevel: 20, weightPerLevel: 0.003 },
          { id: 'frenzy_dur', name: '프렌지 지속시간 (옷)', maxLevel: 20, weightPerLevel: 0.0025 }
        ]
      },
      dark_mage: {
        name: '다크 메이지', statType: '마법 공격력', statUnit: '마공', defaultWeapon: 'two_handed',
        validReforges: [
          { id: 'fireball_dmg', name: '파이어볼 대미지 (옷)', maxLevel: 20, weightPerLevel: 0.0035 },
          { id: 'light_rod', name: '라이트닝 로드 (장갑)', maxLevel: 20, weightPerLevel: 0.003 },
          { id: 'magic_att', name: '마법 공격력 (무기)', maxLevel: 20, flatAdd: 4 }
        ]
      },
      elemental_knight: {
        name: '엘레멘탈 나이트', statType: '최대 대미지', statUnit: '맥뎀', defaultWeapon: 'two_handed',
        validReforges: [
          { id: 'smash_dmg', name: '스매시 대미지 (장갑)', maxLevel: 20, weightPerLevel: 0.004 },
          { id: 'windmill_dmg', name: '윈드밀 대미지 (모자)', maxLevel: 20, weightPerLevel: 0.0018 },
          { id: 'max_att', name: '한계돌파 최대공격력', maxLevel: 25, flatAdd: 2.5 }
        ]
      },
      alchemic_stinger: {
        name: '알케믹 스팅어', statType: '최대 대미지', statUnit: '맥뎀', defaultWeapon: 'two_handed',
        validReforges: [
          { id: 'magnum_dmg', name: '매그넘 샷 대미지 (장갑)', maxLevel: 20, weightPerLevel: 0.0045 },
          { id: 'crash_shot', name: '크래시 샷 파편 (옷)', maxLevel: 20, weightPerLevel: 0.0025 }
        ]
      },
      saint_bard: {
        name: '세인트 바드', statType: '마법 공격력', statUnit: '마공', defaultWeapon: 'one_handed',
        validReforges: [
          { id: 'music_buff', name: '음악 버프 효과 (악기)', maxLevel: 20, weightPerLevel: 0.006 },
          { id: 'healing', name: '힐링 회복량 (옷)', maxLevel: 20, weightPerLevel: 0.003 }
        ]
      }
    };

    const DUNGEONS = {
      talagach: { name: '탈라가흐 (최종)', piercingMult: 0.145, label: '탈라가흐 (보호 250+)' },
      brireche_4: { name: '브리레흐 4관', piercingMult: 0.130, label: '브리레흐 4관 (보호 220)' },
      brireche_13: { name: '브리레흐 1~3관', piercingMult: 0.115, label: '브리레흐 1~3관 (보호 180)' },
      glen_hard: { name: '글렌베르나 어려움', piercingMult: 0.105, label: '글렌베르나 어려움 (보호 150)' },
      chrom_100: { name: '크롬바스 100%', piercingMult: 0.085, label: '크롬바스 100% (보호 120)' }
    };

    let currentArcanaKey = 'forbidden_alchemist';
    let activeReforges = []; 

    function renderReforgeList() {
      const container = document.getElementById('reforgeListContainer');
      container.innerHTML = '';
      const validList = ARCANAS[currentArcanaKey].validReforges;

      if (activeReforges.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 py-2 text-center">선택된 세공이 없습니다.</p>`;
        return;
      }

      activeReforges.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = "flex items-center gap-2 bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-xs";
        let optionsHtml = validList.map(opt => `<option value="${opt.id}" ${opt.id === item.id ? 'selected' : ''}>${opt.name}</option>`).join('');
        row.innerHTML = `
          <div class="flex-1">
            <select class="reforge-select w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none" data-index="${index}">${optionsHtml}</select>
          </div>
          <div class="w-24 flex items-center gap-1">
            <input type="number" min="1" max="25" value="${item.level}" class="reforge-level w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-amber-300 font-semibold text-center focus:outline-none" data-index="${index}">
            <span class="text-slate-400">Lv</span>
          </div>
          <button class="remove-reforge-btn text-rose-400 hover:bg-rose-500/10 p-1 rounded transition" data-index="${index}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        `;
        container.appendChild(row);
      });
      lucide.createIcons();
      attachReforgeEvents();
      calculateTotal();
    }

    function addReforgeRow() {
      const validList = ARCANAS[currentArcanaKey].validReforges;
      if (validList.length === 0) return;
      activeReforges.push({ id: validList[0].id, level: 20 });
      renderReforgeList();
    }

    function attachReforgeEvents() {
      document.querySelectorAll('.reforge-select').forEach(sel => { sel.addEventListener('change', (e) => { activeReforges[e.target.dataset.index].id = e.target.value; calculateTotal(); }); });
      document.querySelectorAll('.reforge-level').forEach(inp => { inp.addEventListener('input', (e) => { activeReforges[e.target.dataset.index].level = Security.clampNumber(e.target.value, 0, 25, 0); calculateTotal(); }); });
      document.querySelectorAll('.remove-reforge-btn').forEach(btn => { btn.addEventListener('click', (e) => { activeReforges.splice(e.currentTarget.dataset.index, 1); renderReforgeList(); }); });
    }

    function calculateTotal() {
      const baseStat = Security.clampNumber(document.getElementById('baseStatInput').value, 0, 8000, 1500);
      const piercing = Security.clampNumber(document.getElementById('piercingSelect').value, 0, 9, 0);
      const rGrade = Security.clampNumber(document.getElementById('upgradeSelect').value, 0, 8, 0);
      const weaponType = document.getElementById('weaponTypeSelect').value;
      const bonusDmgRate = Security.clampNumber(document.getElementById('bonusDamageInput').value, 0, 100, 0) / 100;
      const dungeon = DUNGEONS[document.getElementById('dungeonSelect').value];

      const addFromPiercing = Math.round(baseStat * (piercing * dungeon.piercingMult));

      const rawCritDmg = R_GRADE_DATA[weaponType][rGrade] || 0;
      const critMult = rawCritDmg * 0.35; 
      
      document.getElementById('rGradeInfoText').textContent = 
        `적용 크리티컬 대미지: +${Math.round(rawCritDmg * 100)}% (크리 기댓값 환산율: +${(critMult * 100).toFixed(1)}%)`;

      const addFromMult = Math.round(baseStat * critMult) + Math.round(baseStat * bonusDmgRate);

      let addFromReforge = 0;
      const defs = ARCANAS[currentArcanaKey].validReforges;
      activeReforges.forEach(item => {
        const def = defs.find(d => d.id === item.id);
        if (def) {
          if (def.flatAdd) addFromReforge += item.level * def.flatAdd;
          else if (def.weightPerLevel) addFromReforge += Math.round(baseStat * (item.level * def.weightPerLevel));
        }
      });

      const totalScore = baseStat + addFromPiercing + addFromMult + addFromReforge;

      document.getElementById('totalScoreText').textContent = totalScore.toLocaleString();
      document.getElementById('breakdownBase').textContent = baseStat.toLocaleString();
      document.getElementById('breakdownPiercing').textContent = `+ ${addFromPiercing.toLocaleString()}`;
      document.getElementById('breakdownMult').textContent = `+ ${addFromMult.toLocaleString()}`;
      document.getElementById('breakdownReforge').textContent = `+ ${addFromReforge.toLocaleString()}`;

      const tierEl = document.getElementById('tierVerdict');
      if (totalScore >= 4500) { tierEl.textContent = '[ 탈라가흐 / 브리레흐 4관 프리패스 ]'; tierEl.className = 'text-xs font-semibold text-purple-400 mt-2'; }
      else if (totalScore >= 3500) { tierEl.textContent = '[ 브리레흐 1~3관 파티 권장 컷 ]'; tierEl.className = 'text-xs font-semibold text-rose-400 mt-2'; }
      else if (totalScore >= 2700) { tierEl.textContent = '[ 글렌 어려움 숙련 딜러 ]'; tierEl.className = 'text-xs font-semibold text-emerald-400 mt-2'; }
      else { tierEl.textContent = '[ 글렌 보통 / 크롬바스 진입 구간 ]'; tierEl.className = 'text-xs font-semibold text-amber-400 mt-2'; }

      updateEfficiencyReport(baseStat, dungeon);
    }

    function updateEfficiencyReport(baseStat, dungeon) {
      const rep = document.getElementById('efficiencyReport');
      rep.innerHTML = `
        <div class="flex justify-between items-center p-2 rounded bg-slate-950 border border-slate-800">
          <span class="text-slate-300">피어싱 +1 증가 효율</span>
          <span class="font-bold text-amber-300">+${Math.round(baseStat * dungeon.piercingMult)} 환산 스탯</span>
        </div>
        <div class="flex justify-between items-center p-2 rounded bg-slate-950 border border-slate-800">
          <span class="text-slate-300">보너스 대미지 +1% 효율</span>
          <span class="font-bold text-emerald-300">+${Math.round(baseStat * 0.01)} 환산 스탯</span>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      document.getElementById('arcanaSelect').addEventListener('change', (e) => {
        currentArcanaKey = e.target.value;
        const arc = ARCANAS[currentArcanaKey];
        document.getElementById('baseStatLabel').textContent = `노도핑 ${arc.statType}`;
        document.getElementById('arcanaBadge').textContent = arc.name;
        document.getElementById('weaponTypeSelect').value = arc.defaultWeapon;
        activeReforges = [{ id: arc.validReforges[0].id, level: 20 }];
        renderReforgeList();
      });

      document.getElementById('dungeonSelect').addEventListener('change', (e) => {
        document.getElementById('cardDungeonBadge').textContent = DUNGEONS[e.target.value].label;
        calculateTotal();
      });

      ['baseStatInput', 'piercingSelect', 'upgradeSelect', 'weaponTypeSelect', 'bonusDamageInput'].forEach(id => {
        document.getElementById(id).addEventListener('input', calculateTotal);
      });

      document.getElementById('nicknameInput').addEventListener('input', (e) => { document.getElementById('cardServerBadge').textContent = `${document.getElementById('serverSelect').value} | ${Security.sanitizeString(e.target.value)}`; });
      document.getElementById('serverSelect').addEventListener('change', () => { document.getElementById('cardServerBadge').textContent = `${document.getElementById('serverSelect').value} | ${Security.sanitizeString(document.getElementById('nicknameInput').value)}`; });
      document.getElementById('addReforgeBtn').addEventListener('click', addReforgeRow);

      activeReforges = [{ id: 'water_cannon', level: 20 }];
      renderReforgeList();
    });
  </script>
</body>
</html>
