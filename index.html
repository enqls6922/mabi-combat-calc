<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마비노기 전투력 계산기 & AI 캐릭터 카드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="min-h-screen custom-scrollbar flex flex-col items-center p-4 md:p-8 select-none">
  <div class="w-full max-w-6xl flex flex-col lg:flex-row gap-8 items-start justify-center">

    <!-- 좌측: 입력 패널 & 스펙 설정 -->
    <div class="w-full lg:w-1/2 flex flex-col gap-6 bg-gray-900/80 border border-gray-800 p-6 rounded-2xl shadow-xl backdrop-blur-sm">
      <div class="flex items-center justify-between border-b border-gray-800 pb-4">
        <div>
          <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
            ⚔️ 마비노기 전투력 계산기
          </h1>
          <p class="text-xs text-gray-400 mt-1">캐릭터 스펙 입력 및 AI 카드 일러스트 생성</p>
        </div>
        <span class="text-xs px-2.5 py-1 rounded-full bg-blue-950/80 border border-blue-700/60 text-blue-300 font-medium">v1.2</span>
      </div>

      <!-- 이미지 업로드 & 조절기 -->
      <div class="flex flex-col gap-3">
        <label class="text-sm font-bold text-gray-200 flex items-center justify-between">
          <span>캐릭터 스크린샷 등록</span>
          <span class="text-xs font-normal text-gray-400">드래그로 위치 조절 / 휠로 줌 조절</span>
        </label>
        <div class="flex items-center gap-3">
          <input type="file" id="imageInput" accept="image/*" class="hidden" />
          <button type="button" onclick="document.getElementById('imageInput').click()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-sm font-medium rounded-xl border border-gray-700 transition">
            📁 파일 선택
          </button>
          <button type="button" id="resetPositionBtn" class="px-3 py-2 bg-gray-800/60 hover:bg-gray-700/60 text-xs text-gray-300 rounded-xl border border-gray-700/70 transition">
            위치 초기화
          </button>
          <span id="fileName" class="text-xs text-gray-500 truncate max-w-[200px]">선택된 파일 없음</span>
        </div>
      </div>

      <!-- AI 생성 컨트롤 섹션 -->
      <div class="flex flex-col gap-3 p-4 rounded-xl bg-gray-800/40 border border-gray-800">
        <div class="flex items-center justify-between">
          <span class="text-sm font-bold text-gray-200 flex items-center gap-1.5">
            ✨ AI 일러스트 카드 변환
          </span>
          <span id="remainCountBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">
            남은 횟수: 계산 중
          </span>
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs text-gray-400">커스텀 스타일/프롬프트 (선택사항)</label>
          <input type="text" id="customPromptInput" placeholder="예: glowing eyes, magical aura, battle pose" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-amber-500" />
        </div>

        <!-- 캡차 위젯 컨테이너 -->
        <div id="turnstileContainer" class="my-1 flex justify-center"></div>

        <div class="flex items-center gap-2 mt-1">
          <button type="button" id="generateAiBtn" class="flex-1 py-2.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-orange-950/40 transition flex items-center justify-center gap-2">
            <span>✨ AI 일러스트 생성하기</span>
          </button>
          <button type="button" id="revertImageBtn" class="hidden px-3 py-2.5 bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 rounded-xl border border-gray-700 transition">
            원본 복구
          </button>
        </div>
        <p id="aiStatusMessage" class="text-xs text-center text-gray-400 min-h-[1rem]"></p>
      </div>

      <!-- 기본 스펙 입력 -->
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-gray-400">서버 & 닉네임</label>
          <div class="flex gap-2">
            <select id="serverSelect" class="bg-gray-950 border border-gray-800 rounded-lg px-2.5 py-2 text-sm text-gray-200">
              <option value="류트">류트</option>
              <option value="만돌린">만돌린</option>
              <option value="하프">하프</option>
              <option value="울프">울프</option>
            </select>
            <input type="text" id="characterNameInput" value="밀레시안" class="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200" />
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-gray-400">아르카나</label>
          <select id="arcanaSelect" class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200">
            <option value="none">선택 안 함</option>
            <option value="elemental_knight">엘레멘탈 나이트</option>
            <option value="mage">세인트 바드</option>
            <option value="alchemist">알케믹 스팅어</option>
            <option value="dark_mage">다크메이지</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-gray-400">최대 공격력 / 마법 공격력</label>
          <input type="number" id="baseDamageInput" value="1500" class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-gray-400">피어싱 레벨</label>
          <input type="number" id="piercingInput" value="9" min="0" max="9" class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-gray-400">보호 / 마법보호</label>
          <input type="number" id="defenseInput" value="120" class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-gray-400">크리티컬 대미지 (%)</label>
          <input type="number" id="critDamageInput" value="250" class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200" />
        </div>
      </div>
    </div>

    <!-- 우측: 캐릭터 카드 뷰 -->
    <div class="w-full lg:w-[460px] flex flex-col items-center">
      <div id="characterCard" class="w-full bg-[#0d1322] border border-[#1e293b] rounded-2xl p-5 shadow-2xl flex flex-col gap-4 relative overflow-hidden">
        
        <!-- 카드 상단 헤더 -->
        <div class="flex items-center justify-between z-10">
          <span class="text-xs px-3 py-1 rounded-full bg-blue-950/70 border border-blue-800/50 text-blue-300 font-medium">
            에린 스펙 계산 기준
          </span>
          <span id="cardHeaderUser" class="text-xs font-bold text-gray-200 tracking-wide">
            류트 | 밀레시안
          </span>
        </div>

        <!-- 이미지 컨테이너 (스크린샷 / AI 일러스트 렌더링 프레임) -->
        <div id="imageViewport" class="relative w-full h-[380px] rounded-xl overflow-hidden bg-black border border-gray-800/80 cursor-grab active:cursor-grabbing flex items-center justify-center">
          <canvas id="cardCanvas" class="absolute pointer-events-none"></canvas>
          <div id="emptyImagePrompt" class="flex flex-col items-center justify-center gap-2 text-gray-600 pointer-events-none">
            <span class="text-3xl">🖼️</span>
            <span class="text-xs">스크린샷을 업로드해 주세요</span>
          </div>
          <!-- AI 일러스트 배지 -->
          <div id="aiBadge" class="hidden absolute top-3 right-3 z-20 flex items-center gap-1.5 px-3 py-1 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold text-[11px] rounded-full shadow-md pointer-events-none">
            <span>✨</span> AI Illustration
          </div>
        </div>

        <!-- 계산 스코어 보드 -->
        <div class="w-full bg-[#080d18] border border-[#1b263b] rounded-xl p-4 flex flex-col items-center justify-center gap-1">
          <span class="text-xs text-gray-400 font-medium">종합 전투력 환산 스코어 (최대 공격력 기준)</span>
          <span id="totalCombatScore" class="text-3xl font-black text-orange-500 tracking-tight">
            2,544
          </span>
        </div>

        <!-- 하단 세부 스펙 표 -->
        <div class="flex flex-col gap-2 text-xs">
          <div class="flex justify-between items-center text-gray-400">
            <span>전투 베이스 스펙</span>
            <span id="displayBaseDmg" class="text-gray-200 font-semibold">1,500</span>
          </div>
          <div class="flex justify-between items-center text-gray-400">
            <span>피어싱 관통 환산치</span>
            <span id="displayPiercingDmg" class="text-gray-200 font-semibold">+ 180</span>
          </div>
          <div class="flex justify-between items-center text-gray-400">
            <span>크리티컬 배율 환산 계수</span>
            <span id="displayCritScale" class="text-gray-200 font-semibold">x 2.50</span>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // -------------------------------------------------------------
    // 상태 및 엘리먼트 참조
    // -------------------------------------------------------------
    const EDGE_FUNCTION_URL = "https://gacxaiyzodywqqzcsiqp.supabase.co/functions/v1/generate-art";
    const TURNSTILE_SITE_KEY = "0x4AAAAAAAi7f30gq5gY78qH"; // Cloudflare Turnstile 공개 키

    const imageInput = document.getElementById("imageInput");
    const fileNameDisplay = document.getElementById("fileName");
    const imageViewport = document.getElementById("imageViewport");
    const cardCanvas = document.getElementById("cardCanvas");
    const ctx = cardCanvas.getContext("2d");
    const emptyImagePrompt = document.getElementById("emptyImagePrompt");
    const resetPositionBtn = document.getElementById("resetPositionBtn");

    const serverSelect = document.getElementById("serverSelect");
    const characterNameInput = document.getElementById("characterNameInput");
    const cardHeaderUser = document.getElementById("cardHeaderUser");
    const baseDamageInput = document.getElementById("baseDamageInput");
    const piercingInput = document.getElementById("piercingInput");
    const critDamageInput = document.getElementById("critDamageInput");
    const totalCombatScore = document.getElementById("totalCombatScore");
    const displayBaseDmg = document.getElementById("displayBaseDmg");
    const displayPiercingDmg = document.getElementById("displayPiercingDmg");
    const displayCritScale = document.getElementById("displayCritScale");

    const generateAiBtn = document.getElementById("generateAiBtn");
    const revertImageBtn = document.getElementById("revertImageBtn");
    const aiBadge = document.getElementById("aiBadge");
    const aiStatusMessage = document.getElementById("aiStatusMessage");
    const remainCountBadge = document.getElementById("remainCountBadge");
    const customPromptInput = document.getElementById("customPromptInput");

    let originalImage = null;
    let currentImage = null;
    let isAiMode = false;
    let turnstileWidgetId = null;
    let turnstileToken = null;

    // 캔버스 뷰포트 드래그 & 줌 트랜스폼 상태
    let transform = {
      x: 0,
      y: 0,
      scale: 1,
      minScale: 1,
    };
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    // -------------------------------------------------------------
    // 초기 캔버스 사이즈 세팅
    // -------------------------------------------------------------
    function updateCanvasSize() {
      const rect = imageViewport.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      cardCanvas.width = rect.width * dpr;
      cardCanvas.height = rect.height * dpr;
      cardCanvas.style.width = `${rect.width}px`;
      cardCanvas.style.height = `${rect.height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // -------------------------------------------------------------
    // 이미지 경계선 이탈 방지 (컨테이너 내부 검은 여백 노출 방지)
    // -------------------------------------------------------------
    function clampTransform() {
      if (!currentImage) return;
      const vpW = imageViewport.clientWidth;
      const vpH = imageViewport.clientHeight;

      // 이미지가 뷰포트를 항상 채울 수 있는 최소 배율 산출 (Cover)
      const scaleX = vpW / currentImage.width;
      const scaleY = vpH / currentImage.height;
      transform.minScale = Math.max(scaleX, scaleY);

      // 최소 배율 미만으로 축소되지 않도록 제한
      if (transform.scale < transform.minScale) {
        transform.scale = transform.minScale;
      }

      const drawW = currentImage.width * transform.scale;
      const drawH = currentImage.height * transform.scale;

      // 가로/세로 이동 시 뷰포트 바깥의 빈 검은 배경이 노출되지 않도록 좌표 클램핑
      const minX = vpW - drawW;
      const maxX = 0;
      if (drawW >= vpW) {
        transform.x = Math.min(maxX, Math.max(minX, transform.x));
      } else {
        transform.x = (vpW - drawW) / 2;
      }

      const minY = vpH - drawH;
      const maxY = 0;
      if (drawH >= vpH) {
        transform.y = Math.min(maxY, Math.max(minY, transform.y));
      } else {
        transform.y = (vpH - drawH) / 2;
      }
    }

    // -------------------------------------------------------------
    // 이미지 뷰포트 맞춤 초기화 (Cover 모드 & 중앙 정렬)
    // -------------------------------------------------------------
    function fitImageToCover() {
      if (!currentImage) return;
      const vpW = imageViewport.clientWidth;
      const vpH = imageViewport.clientHeight;

      const scaleX = vpW / currentImage.width;
      const scaleY = vpH / currentImage.height;
      const baseScale = Math.max(scaleX, scaleY);

      transform.minScale = baseScale;
      transform.scale = baseScale;
      transform.x = (vpW - currentImage.width * baseScale) / 2;
      transform.y = (vpH - currentImage.height * baseScale) / 2;
      clampTransform();
      render();
    }

    // -------------------------------------------------------------
    // 캔버스 렌더링 루틴
    // -------------------------------------------------------------
    function render() {
      const vpW = imageViewport.clientWidth;
      const vpH = imageViewport.clientHeight;

      ctx.clearRect(0, 0, vpW, vpH);

      if (!currentImage) {
        emptyImagePrompt.classList.remove("hidden");
        return;
      }
      emptyImagePrompt.classList.add("hidden");

      ctx.save();
      ctx.drawImage(
        currentImage,
        transform.x,
        transform.y,
        currentImage.width * transform.scale,
        currentImage.height * transform.scale
      );
      ctx.restore();
    }

    // -------------------------------------------------------------
    // 이미지 파일 로드 핸들러
    // -------------------------------------------------------------
    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileNameDisplay.textContent = file.name;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          currentImage = img;
          isAiMode = false;
          aiBadge.classList.add("hidden");
          revertImageBtn.classList.add("hidden");
          updateCanvasSize();
          fitImageToCover();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // -------------------------------------------------------------
    // 마우스 드래그 & 휠 줌 인터랙션 (바운딩 보호 포함)
    // -------------------------------------------------------------
    imageViewport.addEventListener("mousedown", (e) => {
      if (!currentImage) return;
      isDragging = true;
      dragStartX = e.clientX - transform.x;
      dragStartY = e.clientY - transform.y;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging || !currentImage) return;
      transform.x = e.clientX - dragStartX;
      transform.y = e.clientY - dragStartY;
      clampTransform();
      render();
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    imageViewport.addEventListener("wheel", (e) => {
      if (!currentImage) return;
      e.preventDefault();

      const rect = imageViewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const newScale = Math.min(Math.max(transform.scale * zoomFactor, transform.minScale), 6);

      // 마우스 포인터 중심 확대/축소
      transform.x = mouseX - (mouseX - transform.x) * (newScale / transform.scale);
      transform.y = mouseY - (mouseY - transform.y) * (newScale / transform.scale);
      transform.scale = newScale;

      clampTransform();
      render();
    }, { passive: false });

    resetPositionBtn.addEventListener("click", () => {
      if (currentImage) fitImageToCover();
    });

    // -------------------------------------------------------------
    // 전투력 수치 계산 공식
    // -------------------------------------------------------------
    function updateCombatScore() {
      const base = parseFloat(baseDamageInput.value) || 0;
      const piercing = parseFloat(piercingInput.value) || 0;
      const crit = parseFloat(critDamageInput.value) || 100;

      const piercingValue = piercing * 20;
      const critScale = (crit / 100);
      const total = Math.round((base + piercingValue) * (critScale * 0.6 + 0.4));

      totalCombatScore.textContent = total.toLocaleString();
      displayBaseDmg.textContent = base.toLocaleString();
      displayPiercingDmg.textContent = `+ ${piercingValue.toLocaleString()}`;
      displayCritScale.textContent = `x ${(crit / 100).toFixed(2)}`;
    }

    [baseDamageInput, piercingInput, critDamageInput].forEach((input) => {
      input.addEventListener("input", updateCombatScore);
    });

    function updateHeaderInfo() {
      cardHeaderUser.textContent = `${serverSelect.value} | ${characterNameInput.value || "밀레시안"}`;
    }
    serverSelect.addEventListener("change", updateHeaderInfo);
    characterNameInput.addEventListener("input", updateHeaderInfo);

    // -------------------------------------------------------------
    // Cloudflare Turnstile 렌더링 및 사용 횟수 확인
    // -------------------------------------------------------------
    async function checkRemainUsage() {
      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "check" }),
        });
        const data = await res.json();
        if (data && typeof data.remainCount !== "undefined") {
          remainCountBadge.textContent = `오늘 남은 횟수: ${data.remainCount}회`;
          if (data.remainCount <= 0 && !data.isAdmin) {
            generateAiBtn.disabled = true;
            generateAiBtn.classList.add("opacity-50", "cursor-not-allowed");
          }
        }
      } catch (err) {
        remainCountBadge.textContent = "남은 횟수 확인 불가";
      }
    }

    function initTurnstile() {
      if (window.turnstile && document.getElementById("turnstileContainer")) {
        turnstileWidgetId = window.turnstile.render("#turnstileContainer", {
          sitekey: TURNSTILE_SITE_KEY,
          callback: function (token) {
            turnstileToken = token;
          },
          "expired-callback": function () {
            turnstileToken = null;
          }
        });
      }
    }

    window.addEventListener("load", () => {
      updateCanvasSize();
      updateCombatScore();
      checkRemainUsage();
      setTimeout(initTurnstile, 500);
    });

    window.addEventListener("resize", () => {
      updateCanvasSize();
      if (currentImage) {
        clampTransform();
        render();
      }
    });

    // -------------------------------------------------------------
    // AI 일러스트 생성 요청 핸들러
    // -------------------------------------------------------------
    generateAiBtn.addEventListener("click", async () => {
      if (!originalImage) {
        alert("먼저 캐릭터 스크린샷 이미지를 등록해 주세요.");
        return;
      }

      // 현재 뷰포트에 표시된 구도 그대로 캔버스 스냅샷 추출 (고화질 추출)
      const exportCanvas = document.createElement("canvas");
      const vpW = imageViewport.clientWidth;
      const vpH = imageViewport.clientHeight;
      exportCanvas.width = vpW * 2;
      exportCanvas.height = vpH * 2;
      const exportCtx = exportCanvas.getContext("2d");
      exportCtx.scale(2, 2);
      exportCtx.drawImage(
        originalImage,
        transform.x,
        transform.y,
        originalImage.width * transform.scale,
        originalImage.height * transform.scale
      );
      const snapshotBase64 = exportCanvas.toDataURL("image/png");

      generateAiBtn.disabled = true;
      generateAiBtn.classList.add("opacity-60", "cursor-wait");
      aiStatusMessage.textContent = "RunningHub AI 작업 생성 및 일러스트 변환 진행 중...";

      try {
        const response = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            imageBase64: snapshotBase64,
            arcanaKey: document.getElementById("arcanaSelect").value,
            customPrompt: customPromptInput.value,
            turnstileToken: turnstileToken,
          }),
        });

        const result = await response.json();

        if (!response.ok || result.error) {
          throw new Error(result.error || "AI 일러스트 생성에 실패했습니다.");
        }

        const aiImg = new Image();
        aiImg.onload = () => {
          currentImage = aiImg;
          isAiMode = true;
          aiBadge.classList.remove("hidden");
          revertImageBtn.classList.remove("hidden");

          // AI 이미지로 전환 시 뷰포트 크기에 맞춰 새로 피팅하고 바운딩 재설정
          fitImageToCover();

          aiStatusMessage.textContent = "AI 일러스트 변환 완료!";
          if (typeof result.remainCount !== "undefined") {
            remainCountBadge.textContent = `오늘 남은 횟수: ${result.remainCount}회`;
          }
        };
        aiImg.src = result.outputUrl || result.imageUrl || result.url;

      } catch (err) {
        console.error(err);
        aiStatusMessage.textContent = `오류: ${err.message}`;
        alert(`오류: ${err.message}`);
      } finally {
        generateAiBtn.disabled = false;
        generateAiBtn.classList.remove("opacity-60", "cursor-wait");
        if (window.turnstile && turnstileWidgetId) {
          window.turnstile.reset(turnstileWidgetId);
          turnstileToken = null;
        }
      }
    });

    // 원본 복구 버튼
    revertImageBtn.addEventListener("click", () => {
      if (!originalImage) return;
      currentImage = originalImage;
      isAiMode = false;
      aiBadge.classList.add("hidden");
      revertImageBtn.classList.add("hidden");
      aiStatusMessage.textContent = "원본 이미지로 복구되었습니다.";
      fitImageToCover();
    });
  </script>
</body>
</html>
